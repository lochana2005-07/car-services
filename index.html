<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CarServ - Professional Wizard</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Ubuntu:wght@400;500&display=swap" rel="stylesheet"> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #D81324; --secondary: #0B2154; --light: #F2F2F2; }
        body { font-family: 'Ubuntu', sans-serif; background: var(--light); color: #333; }
        
        .hero { 
            background: linear-gradient(rgba(11, 33, 84, .9), rgba(11, 33, 84, .9)), url('https://technext.github.io/car-repair/img/carousel-bg-1.jpg'); 
            background-size: cover; height: 100vh; display: flex; align-items: center; color: white;
        }

        .step-card { 
            display: none; background: white; padding: 40px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 6px solid var(--primary);
        }
        .active-step { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .progress { height: 8px; background: #e9ecef; border-radius: 10px; }
        .progress-bar { background: var(--primary); transition: 0.4s; }
        
        .btn-primary { background: var(--primary); border: none; padding: 12px 30px; font-weight: bold; }
        .btn-secondary { background: var(--secondary); border: none; padding: 12px 30px; color: white; }
        
        .icon-header { font-size: 40px; color: var(--primary); margin-bottom: 15px; }
        label { font-weight: 500; margin-bottom: 5px; color: #555; }
        .form-control { border-radius: 8px; padding: 12px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div id="loginPage" class="hero text-center">
        <div class="container">
            <h1 class="display-3 text-white mb-4">CarServ Portal</h1>
            <div class="row justify-content-center">
                <div class="col-md-5 bg-white p-5 rounded shadow">
                    <h4 class="text-dark mb-4">Vehicle Authentication</h4>
                    <input type="text" id="vID" class="form-control mb-3 text-center fw-bold" placeholder="Enter Vehicle No (e.g. WP-ABC-1234)">
                    <button onclick="startWizard()" class="btn btn-primary w-100 py-3">START SERVICE WIZARD</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appContainer" class="container py-5" style="display:none;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Service Process</h2>
                    <p class="text-muted">Vehicle Number: <span id="vDisplay" class="text-danger fw-bold"></span></p>
                </div>

                <div class="progress mb-5">
                    <div id="progressBar" class="progress-bar" style="width: 16%;"></div>
                </div>

                <div id="step1" class="step-card active-step">
                    <div class="icon-header"><i class="fa fa-car"></i></div>
                    <h3>Step 1: Vehicle Details</h3>
                    <div class="row g-3 mt-2">
                        <div class="col-md-6"><label>Owner Name</label><input type="text" id="owner" class="form-control"></div>
                        <div class="col-md-6"><label>Vehicle Model</label><input type="text" id="model" class="form-control" placeholder="Toyota Vitz"></div>
                    </div>
                    <button class="btn btn-primary mt-4" onclick="nextStep(2)">NEXT <i class="fa fa-chevron-right ms-2"></i></button>
                </div>

                <div id="step2" class="step-card">
                    <div class="icon-header"><i class="fa fa-calendar-alt"></i></div>
                    <h3>Step 2: Service Date</h3>
                    <div class="mt-3"><label>Preferred Appointment</label><input type="date" id="sDate" class="form-control"></div>
                    <div class="mt-4">
                        <button class="btn btn-secondary me-2" onclick="prevStep(1)">Back</button>
                        <button class="btn btn-primary" onclick="nextStep(3)">NEXT</button>
                    </div>
                </div>

                <div id="step3" class="step-card">
                    <div class="icon-header"><i class="fa fa-tools"></i></div>
                    <h3>Step 3: Maintenance History</h3>
                    <div class="mt-3"><label>Any previous issues?</label><textarea id="history" class="form-control" rows="4"></textarea></div>
                    <div class="mt-4">
                        <button class="btn btn-secondary me-2" onclick="prevStep(2)">Back</button>
                        <button class="btn btn-primary" onclick="nextStep(4)">NEXT</button>
                    </div>
                </div>

                <div id="step4" class="step-card">
                    <div class="icon-header"><i class="fa fa-bell"></i></div>
                    <h3>Step 4: Reminders</h3>
                    <div class="form-check form-switch p-3 bg-light rounded mt-3">
                        <input class="form-check-input" type="checkbox" id="remind">
                        <label class="form-check-label ms-2">Enable SMS Service Alerts</label>
                    </div>
                    <div class="mt-4">
                        <button class="btn btn-secondary me-2" onclick="prevStep(3)">Back</button>
                        <button class="btn btn-primary" onclick="nextStep(5)">NEXT</button>
                    </div>
                </div>

                <div id="step5" class="step-card">
                    <div class="icon-header"><i class="fa fa-id-badge"></i></div>
                    <h3>Step 5: Mechanic</h3>
                    <div class="mt-3">
                        <label>Select Specialist</label>
                        <select id="mechanic" class="form-select form-control">
                            <option>Sunil - Senior Tech</option>
                            <option>Kamal - Engine Specialist</option>
                        </select>
                    </div>
                    <div class="mt-4">
                        <button class="btn btn-secondary me-2" onclick="prevStep(4)">Back</button>
                        <button class="btn btn-primary" onclick="nextStep(6)">NEXT</button>
                    </div>
                </div>

                <div id="step6" class="step-card">
                    <div class="icon-header"><i class="fa fa-check-circle"></i></div>
                    <h3>Step 6: Complete</h3>
                    <p class="text-muted">Confirm all details are correct before saving.</p>
                    <div class="mt-4">
                        <button class="btn btn-secondary me-2" onclick="prevStep(5)">Back</button>
                        <button class="btn btn-success px-5 fw-bold" onclick="finish()">SAVE ALL RECORDS</button>
                    </div>
                </div>

                <div id="summary" class="step-card text-center">
                    <h2 class="text-success"><i class="fa fa-thumbs-up"></i> All Done!</h2>
                    <p id="summaryText" class="my-4 fs-5"></p>
                    <button class="btn btn-dark" onclick="location.reload()">GO TO HOME</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentV = "";
        function startWizard() {
            currentV = document.getElementById('vID').value.toUpperCase().trim();
            if(currentV) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('vDisplay').innerText = currentV;
                loadExisting();
            }
        }
        function nextStep(step) {
            document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active-step'));
            document.getElementById('step' + step).classList.add('active-step');
            document.getElementById('progressBar').style.width = (step * 16.6) + "%";
            window.scrollTo(0,0);
        }
        function prevStep(step) { nextStep(step); }
        function finish() {
            const data = {
                owner: document.getElementById('owner').value,
                model: document.getElementById('model').value,
                date: document.getElementById('sDate').value,
                notes: document.getElementById('history').value
            };
            localStorage.setItem(currentV, JSON.stringify(data));
            document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active-step'));
            document.getElementById('summary').classList.add('active-step');
            document.getElementById('summaryText').innerText = `Data for vehicle ${currentV} has been securely saved.`;
        }
        function loadExisting() {
            let saved = localStorage.getItem(currentV);
            if(saved) {
                let d = JSON.parse(saved);
                document.getElementById('owner').value = d.owner || "";
                document.getElementById('model').value = d.model || "";
                document.getElementById('sDate').value = d.date || "";
                document.getElementById('history').value = d.notes || "";
            }
        }
    </script>
</body>
</html>
